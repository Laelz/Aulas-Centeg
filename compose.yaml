services:
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  production:
    profiles: [production]
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:8080:80"

volumes:
  node_modules:
